server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/notificationdb}
    username: ${SPRING_DATASOURCE_USERNAME:notification}
    password: ${SPRING_DATASOURCE_PASSWORD:notification}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  kafka:
    topics:
      consulta-criada: ${KAFKA_TOPIC_CONSULTA_CRIADA:hospital.consultas.criadas.v1}
      consulta-alterada: ${KAFKA_TOPIC_CONSULTA_ALTERADA:hospital.consultas.alteradas.v1}
      consulta-dlt: ${KAFKA_TOPIC_CONSULTA_DLT:hospital.consultas.dlt}

